# Dependency policy for duv, checked by cargo-deny
# (https://embarkstudios.github.io/cargo-deny/) in
# .github/workflows/security.yml, and locally with `cargo deny check`.

[graph]
# Check the dependencies of every platform duv ships binaries for, not just
# the machine running the check (Windows and Linux pull in different crates).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]

[advisories]
# The RustSec advisory database: known vulnerabilities always fail the
# check. Crates flagged as unmaintained and yanked versions fail too.
unmaintained = "all"
yanked = "deny"
# To accept an advisory that doesn't affect duv, add it here with the
# reason, e.g.:
# { id = "RUSTSEC-0000-0000", reason = "only affects X, which duv doesn't use" },
ignore = []

[licenses]
# Permissive licenses, all compatible with duv's MIT license. A dependency
# under anything else fails the check until it's reviewed and added here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
# Two versions of one crate bloat the binary; worth knowing, but common
# and outside duv's control, so only a warning.
multiple-versions = "warn"
# `*` version requirements make builds unpredictable.
wildcards = "deny"

[sources]
# Dependencies only from crates.io: no other registries or git repos.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
